# Generated by PVOS's deploy/sdk/export.py. Change the crates there.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/christcb03/pvos-sdk"

[workspace.dependencies]
base64 = "0.22"
bip32 = "0.5"
bip39 = { version = "2.1", features = ["rand"] }
blake3 = { version = "1.5", features = ["rayon"] }
chacha20poly1305 = "0.10"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdh"] }
libc = "0.2"
nix = { version = "0.29", features = ["user", "fs", "socket"] }
pvfs-client-core = { path = "crates/pvfs-client-core" }
pvfs-crypto = { path = "crates/pvfs-crypto" }
pvfs-log = { path = "crates/pvfs-log" }
pvfs-proto = { path = "crates/pvfs-proto" }
rand = "0.8"
rcgen = "0.13"
rusqlite = { version = "0.31", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
tungstenite = "0.24"
